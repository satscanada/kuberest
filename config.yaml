      password_hash: "$2a$10$7EqJtq98hPqEX7fNZaFWoO.H8hA4n9n0r9YuqbWtaXDpUe1koXSPK"
      role: admin
    - username: viewer
      # Replace with your own bcrypt hash before deploy.
      password_hash: "$2b$10$TKh8H1.PfQ4x7Yf2w8M2Vu7N6fQ5fA02oR4i8fDwWQK2Mih0Y0iP2"
