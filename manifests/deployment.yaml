apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberest
  namespace: kuberest
  labels:
    app: kuberest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuberest
  template:
    metadata:
      labels:
        app: kuberest
    spec:
      serviceAccountName: kuberest
      containers:
        - name: kuberest
          image: kuberest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: TOOL_NAMESPACE
              value: "kuberest"
            - name: KUBEREST_IMAGE
              value: "kuberest:latest"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: kuberest-config
            items:
              - key: config.yaml
                path: config.yaml
