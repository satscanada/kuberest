apiVersion: v1
kind: ConfigMap
metadata:
  name: kuberest-config
  namespace: kuberest
data:
  config.yaml: |
    auth:
      jwt_secret: "change-me-in-production"
      token_expiry: "8h"
      users:
        - username: admin
          password_hash: "<replace-with-bcrypt-hash>"
          role: admin
        - username: viewer
          password_hash: "<replace-with-bcrypt-hash>"
          role: viewer

    namespaces:
      - name: payments
        enabled: true
      - name: reporting
        enabled: true

    schedule:
      scale_down: "0 20 * * 5"
      scale_up: "0 6 * * 1"

    comms:
      enabled: false
      endpoint: "https://your-notification-service/api/events"
      secret_header: "X-KubeRest-Secret"
      secret_value: "replace-me"
      timeout_ms: 3000
